name: Smilebaba CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

# ── Jobs ───────────────────────────
jobs:

  # ── 1. Test & Build ──────────────────────────────────────────────────────────
  build:
    name: Test & Build
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci                          # ci is faster + stricter than npm install

      - name: Run tests
        run: npm test --if-present           # won't fail if no test script defined yet

      - name: Build
        run: npm run build --if-present


  # ── 2. Deploy (only on push to main, not PRs) ────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build                             # only runs if build job passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render deploy (backend)
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"


      - name: Wait for Render to finish deploying
        run: sleep 60                        # give Render time to build + start

      - name: Notify app of new version
        run: |
          curl --fail -X POST \
            "${{ secrets.NEXT_PUBLIC_API_URL }}/updates/deploy" \
            -H "x-deploy-secret: ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"${{ github.sha }}\"}"
        # This triggers the SSE broadcast → all connected browsers auto-reload

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deploy succeeded — version ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deploy failed — check logs above"